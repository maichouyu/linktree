<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邁殠虞</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
        }
        /* 連結按鈕容器樣式 */
        .link-btn {
            background-color: #1a1008;
            border: 1px solid rgba(249, 115, 22, 0.15);
            transition: all 0.2s ease-in-out;
            border-radius: 9999px;
        }
        .link-btn:hover {
            background-color: #26170d;
            border-color: rgba(249, 115, 22, 0.5);
            transform: translateY(-2px);
        }
        .modal-bg {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
        }
        /* 調整 SVG 圖示大小以適應按鈕 */
        .copy-icon {
            width: 1em;
            height: 1em;
            fill: currentColor;
        }
        .link-btn a:focus-visible,
        .link-btn button:focus-visible,
        #shareBtn:focus-visible {
            outline: 2px solid #f97316;
            outline-offset: 2px;
            border-radius: 9999px;
        }

        /* ===== 電腦版版面（≥1024px）；手機版維持原樣 ===== */
        @media (min-width: 1024px) {
            body {
                background-image: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(249, 115, 22, 0.12), transparent 70%);
                background-repeat: no-repeat;
            }
            .link-btn {
                border-radius: 1rem;
                min-height: 5rem;
            }
            .link-btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 30px -10px rgba(249, 115, 22, 0.35);
            }
            /* 整張卡片都可點擊（複製鈕浮在上層） */
            .link-btn a::after {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
            }
            .link-btn button {
                position: relative;
                z-index: 10;
            }
            .link-btn a:focus-visible,
            .link-btn button:focus-visible {
                border-radius: 0.5rem;
            }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between selection:bg-orange-500 selection:text-black">

    <!-- 頂部導航：只保留分享按鈕 -->
    <header class="w-full max-w-md lg:max-w-5xl mx-auto p-4 lg:px-6 lg:pt-8 flex justify-end items-center">
        <button id="shareBtn" class="w-10 h-10 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center hover:bg-neutral-800 transition text-neutral-300 shadow-md" title="分享頁面">
            <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
        </button>
    </header>

    <main class="w-full max-w-md lg:max-w-5xl mx-auto px-6 py-4 flex-grow flex flex-col items-center lg:flex-row lg:items-start lg:gap-16 lg:pt-8">
        <!-- 個人資料區（電腦版固定在左側） -->
        <section class="flex flex-col items-center lg:w-72 lg:shrink-0 lg:sticky lg:top-12">
            <!-- 大頭貼容器 -->
            <div class="relative mb-4">
                <div class="w-28 h-28 lg:w-44 lg:h-44 rounded-full overflow-hidden bg-neutral-800 flex items-center justify-center shadow-lg lg:ring-2 lg:ring-orange-500/30 lg:ring-offset-4 lg:ring-offset-black">
                    <img id="profileAvatar" src="avatar.jpg" alt="大頭貼" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- 標題名稱 -->
            <h1 id="profileTitle" class="text-xl lg:text-3xl font-bold tracking-wider text-orange-500 mb-8 lg:mb-2 text-center">
                載入中...
            </h1>
            <p id="profileMeta" class="hidden lg:block text-sm text-neutral-500 tracking-wide"></p>
        </section>

        <!-- 連結按鈕列表（電腦版為雙欄卡片） -->
        <section id="linksContainer" class="w-full flex flex-col gap-3.5 lg:grid lg:grid-cols-2 lg:gap-4 lg:flex-1">
            <!-- 動態插入連結，結構已調整 -->
        </section>
    </main>

    <!-- 底部：保持乾淨 -->
    <footer class="w-full max-w-md lg:max-w-5xl mx-auto py-4 lg:py-8 px-4"></footer>

    <!-- 複製成功提示 Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-neutral-800 text-white px-4 py-2 rounded-xl shadow-lg border border-neutral-700 text-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        網址已複製到剪貼簿！
    </div>

    <script>
        // ==========================================
        // 🌟 個人資料與連結清單 🌟
        // ==========================================
        const pageData = {
            title: "邁殠虞",
            avatar: "avatar.jpg", // 已指定使用本機上傳的頭像檔案
            links: [
                { title: "列車速度v4.1.6", url: "https://maichouyu.github.io/trainspeedlatest/" },
                { title: "速度計算v2.9.1", url: "https://maichouyu.github.io/trainspeed2.9/" },
                { title: "臺鐵45天內加班或班次調整資訊", url: "https://maichouyu.github.io/tdx-extra-train-automatic-filtering/" },
                { title: "加速度積分 與 GPS測速器", url: "https://maichouyu.github.io/Acceleration-sensor/" },
                { title: "加速度積分 與 GPS測速器 longhorn 陀螺儀", url: "https://maichouyu.github.io/Acceleration-sensor-longhorn/" }, // 修正：此處補上逗號
                { title: "加速度積分 與 GPS測速器 whistler 過濾", url: "https://maichouyu.github.io/Acceleration-sensor-whistler/" }
            ]
        };

        const profileTitle = document.getElementById('profileTitle');
        const profileMeta = document.getElementById('profileMeta');
        const profileAvatar = document.getElementById('profileAvatar');
        const linksContainer = document.getElementById('linksContainer');
        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toast');

        function renderApp() {
            profileTitle.textContent = pageData.title;
            profileMeta.textContent = `${pageData.links.length} 個專案`;
            profileAvatar.src = pageData.avatar;
            linksContainer.innerHTML = '';

            pageData.links.forEach((link, index) => {
                // 建立外層容器 (取代原本的 <a>)
                const container = document.createElement('div');
                container.className = 'link-btn w-full py-4 px-5 lg:py-5 lg:px-6 flex items-center justify-between shadow-lg group relative';

                // 電腦版專用的序號
                const indexLabel = document.createElement('span');
                indexLabel.className = 'hidden lg:block text-orange-500/50 font-mono text-sm mr-4 select-none';
                indexLabel.textContent = String(index + 1).padStart(2, '0');
                
                // 建立中間的連結標題 (點擊標題會導向)
                const titleLink = document.createElement('a');
                if (link.url && link.url.startsWith('http')) {
                    titleLink.href = link.url;
                    titleLink.target = '_blank';
                    titleLink.rel = 'noopener noreferrer';
                } else {
                    titleLink.href = '#';
                }
                titleLink.className = 'font-semibold text-neutral-100 group-hover:text-orange-400 transition text-center lg:text-left flex-grow text-sm sm:text-base';
                titleLink.textContent = link.title; // textContent 本身就安全，不需再 escape

                // 建立右側的複製按鈕
                const copyBtn = document.createElement('button');
                copyBtn.className = 'text-neutral-500 hover:text-orange-400 p-1 text-sm transition w-6 flex justify-end items-center';
                copyBtn.title = '複製連結';
                copyBtn.innerHTML = `
                    <svg class="copy-icon" viewBox="0 0 256 256">
                        <path d="M216,32H88a8,8,0,0,0-8,8V82.34a8,8,0,0,0,16,0V48h112V160H173.66a8,8,0,0,0,0,16H216a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,88V216a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V88a8,8,0,0,1,8-8H152A8,8,0,0,1,160,88Zm-16,8H48V200H144Z"/>
                    </svg>
                `;

                // 綁定複製按鈕的點擊事件
                copyBtn.onclick = (e) => {
                    e.preventDefault(); // 防止觸發外層的連結跳轉
                    if (link.url && link.url !== '#') {
                        copyToClipboard(link.url);
                    } else {
                        showToast('此連結未設定網址');
                    }
                };

                // 組裝元素
                container.appendChild(indexLabel);
                container.appendChild(titleLink);
                container.appendChild(copyBtn);
                linksContainer.appendChild(container);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }

        // 為了保持 API 一致性保留此函數
        window.showLinkOptions = function(url) {
            if (url && url !== '#') {
                copyToClipboard(url);
            } else {
                showToast('此連結未設定網址');
            }
        };

        shareBtn.addEventListener('click', () => {
            copyToClipboard(window.location.href);
        });

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('網址已複製到剪貼簿！');
                }).catch(() => {
                    fallbackCopyTextToClipboard(text);
                });
            } else {
                fallbackCopyTextToClipboard(text);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('網址已複製到剪貼簿！');
            } catch (err) {
                showToast('複製失敗');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        window.onload = () => {
            renderApp();
        };
    </script>
</body>
</html>
