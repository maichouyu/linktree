<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邁殠虞</title>
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#000000">
    <!-- 主題自動偵測：放在最前面執行，避免淺色裝置先閃一下深色畫面 -->
    <script>
        // 追隨系統（硬體）深淺色設定；沒有手動切換，也不使用 localStorage
        const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

        function handleThemeChange() {
            const isDark = darkModeMediaQuery.matches;
            // 類名掛在 <html>，因為此時 <body> 還不存在
            document.documentElement.classList.toggle('light-mode', !isDark);

            // 同步瀏覽器網址列 / 狀態列顏色
            const themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) themeMeta.setAttribute('content', isDark ? '#000000' : '#f5f5f7');
        }

        // 初次載入立即套用一次
        handleThemeChange();

        // 監聽系統即時切換（新舊瀏覽器語法皆相容）
        if (darkModeMediaQuery.addEventListener) {
            darkModeMediaQuery.addEventListener('change', handleThemeChange);
        } else if (darkModeMediaQuery.addListener) {
            darkModeMediaQuery.addListener(handleThemeChange);
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 顏色變數（預設深色） */
        :root {
            color-scheme: dark;
            --bg: #000000;
            --text: #ffffff;
            --accent: #f97316;            /* 標題、強調色 */
            --accent-hover: #fb923c;
            --muted: #737373;
            --card-bg: #1a1008;
            --card-bg-hover: #26170d;
            --card-border: rgba(249, 115, 22, 0.15);
            --card-border-hover: rgba(249, 115, 22, 0.5);
            --link-text: #f5f5f5;
            --index-text: rgba(249, 115, 22, 0.5);
            --avatar-bg: #262626;
            --avatar-ring: rgba(249, 115, 22, 0.3);
            --share-bg: #171717;
            --share-bg-hover: #262626;
            --share-border: #262626;
            --share-text: #d4d4d4;
            --glow: rgba(249, 115, 22, 0.12);
            --hover-glow: rgba(249, 115, 22, 0.35);
        }
        /* 淺色模式（由上方 handleThemeChange 依系統設定加上 light-mode 類名） */
        :root.light-mode {
            color-scheme: light;
            --bg: #f5f5f7;
            --text: #1a1a1a;
            --accent: #c2410c;            /* 加深橘色，確保淺底上的對比度 */
            --accent-hover: #9a3412;
            --muted: #6b7280;
            --card-bg: #ffffff;
            --card-bg-hover: #fff4e8;
            --card-border: rgba(234, 88, 12, 0.22);
            --card-border-hover: rgba(234, 88, 12, 0.55);
            --link-text: #262626;
            --index-text: rgba(194, 65, 12, 0.6);
            --avatar-bg: #e5e5e5;
            --avatar-ring: rgba(234, 88, 12, 0.35);
            --share-bg: #ffffff;
            --share-bg-hover: #f0f0f0;
            --share-border: #d4d4d4;
            --share-text: #404040;
            --glow: rgba(249, 115, 22, 0.10);
            --hover-glow: rgba(234, 88, 12, 0.25);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 套用主題色的元件 */
        .share-btn {
            background-color: var(--share-bg);
            border: 1px solid var(--share-border);
            color: var(--share-text);
            transition: background-color 0.2s;
        }
        .share-btn:hover { background-color: var(--share-bg-hover); }

        .avatar-wrap {
            background-color: var(--avatar-bg);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -4px rgba(0, 0, 0, 0.2);
        }
        .profile-title { color: var(--accent); }
        .profile-meta { color: var(--muted); }
        .link-index { color: var(--index-text); }
        .link-title { color: var(--link-text); }
        .copy-btn { color: var(--muted); }
        .copy-btn:hover { color: var(--accent-hover); }

        /* 連結按鈕容器樣式 */
        .link-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: all 0.2s ease-in-out;
            border-radius: 9999px;
        }
        .link-btn:hover {
            background-color: var(--card-bg-hover);
            border-color: var(--card-border-hover);
            transform: translateY(-2px);
        }
        .link-btn:hover .link-title { color: var(--accent-hover); }
        .modal-bg {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
        }
        /* 調整 SVG 圖示大小以適應按鈕 */
        .copy-icon {
            width: 1em;
            height: 1em;
            fill: currentColor;
        }
        .link-btn a:focus-visible,
        .link-btn button:focus-visible,
        #shareBtn:focus-visible {
            outline: 2px solid #f97316;
            outline-offset: 2px;
            border-radius: 9999px;
        }

        /* ===== 電腦版版面（≥768px）；手機版維持原樣 ===== */
        @media (min-width: 768px) {
            body {
                background-image: radial-gradient(ellipse 60% 40% at 50% 0%, var(--glow), transparent 70%);
                background-repeat: no-repeat;
            }
            /* 電腦版頭像外圈（外圈間隔色隨背景變化） */
            .avatar-wrap {
                box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--avatar-ring),
                            0 10px 15px -3px rgba(0, 0, 0, 0.2);
            }
            .link-btn {
                border-radius: 1rem;
                min-height: 5rem;
            }
            .link-btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 30px -10px var(--hover-glow);
            }
            /* 整張卡片都可點擊（複製鈕浮在上層） */
            .link-btn a::after {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
            }
            .link-btn button {
                position: relative;
                z-index: 10;
            }
            .link-btn a:focus-visible,
            .link-btn button:focus-visible {
                border-radius: 0.5rem;
            }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between selection:bg-orange-500 selection:text-black">

    <!-- 頂部導航：只保留分享按鈕 -->
    <header class="w-full max-w-md md:max-w-5xl mx-auto p-4 md:px-6 md:pt-8 flex justify-end items-center">
        <button id="shareBtn" class="share-btn w-10 h-10 rounded-full flex items-center justify-center shadow-md" title="分享頁面">
            <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
        </button>
    </header>

    <main class="w-full max-w-md md:max-w-5xl mx-auto px-6 py-4 flex-grow flex flex-col items-center md:flex-row md:items-start md:justify-center md:gap-8 lg:gap-16 md:pt-8">
        <!-- 個人資料區（電腦版固定在左側） -->
        <section class="flex flex-col items-center md:w-56 lg:w-72 md:shrink-0 md:sticky md:top-12">
            <!-- 大頭貼容器 -->
            <div class="relative mb-4">
                <div class="avatar-wrap w-28 h-28 md:w-36 md:h-36 lg:w-44 lg:h-44 rounded-full overflow-hidden flex items-center justify-center">
                    <img id="profileAvatar" src="avatar.jpg" alt="大頭貼" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- 標題名稱 -->
            <h1 id="profileTitle" class="profile-title text-xl md:text-2xl lg:text-3xl font-bold tracking-wider mb-8 md:mb-2 text-center">
                載入中...
            </h1>
            <p id="profileMeta" class="profile-meta hidden md:block text-sm tracking-wide"></p>
        </section>

        <!-- 連結按鈕列表（電腦版為雙欄卡片） -->
        <section id="linksContainer" class="w-full md:max-w-xl flex flex-col gap-3.5 md:gap-4 md:flex-1">
            <!-- 動態插入連結，結構已調整 -->
        </section>
    </main>

    <!-- 底部：保持乾淨 -->
    <footer class="w-full max-w-md md:max-w-5xl mx-auto py-4 md:py-8 px-4"></footer>

    <!-- 複製成功提示 Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-neutral-800 text-white px-4 py-2 rounded-xl shadow-lg border border-neutral-700 text-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        網址已複製到剪貼簿！
    </div>

    <script>
        // ==========================================
        // 🌟 個人資料與連結清單 🌟
        // ==========================================
        const pageData = {
            title: "邁殠虞",
            avatar: "avatar.jpg", // 已指定使用本機上傳的頭像檔案
            links: [
                { title: "列車速度v4.1.6", url: "https://maichouyu.github.io/trainspeedlatest/" },
                { title: "速度計算v2.9.1", url: "https://maichouyu.github.io/trainspeed2.9/" },
                { title: "臺鐵45天內加班或班次調整資訊", url: "https://maichouyu.github.io/tdx-extra-train-automatic-filtering/" },
                { title: "加速度積分 與 GPS測速器", url: "https://maichouyu.github.io/Acceleration-sensor/" },
                { title: "加速度積分 與 GPS測速器 longhorn 陀螺儀", url: "https://maichouyu.github.io/Acceleration-sensor-longhorn/" },
                { title: "麥香魚的 自製導航", url: "https://maichouyu.github.io/self-made-navigation/" },
                { title: "加速度積分 與 GPS測速器 whistler 過濾", url: "https://maichouyu.github.io/Acceleration-sensor-whistler/" },
                { title: "新北捷運三鶯線時刻表(測試版)", url: "https://maichouyu.github.io/sanying-line-timetable/" }
            ]
        };

        const profileTitle = document.getElementById('profileTitle');
        const profileMeta = document.getElementById('profileMeta');
        const profileAvatar = document.getElementById('profileAvatar');
        const linksContainer = document.getElementById('linksContainer');
        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toast');

        function renderApp() {
            profileTitle.textContent = pageData.title;
            profileMeta.textContent = `${pageData.links.length} 個專案`;
            profileAvatar.src = pageData.avatar;
            linksContainer.innerHTML = '';

            pageData.links.forEach((link, index) => {
                // 建立外層容器 (取代原本的 <a>)
                const container = document.createElement('div');
                container.className = 'link-btn w-full py-4 px-5 md:py-5 md:px-6 flex items-center justify-between shadow-lg group relative';

                // 電腦版專用的序號
                const indexLabel = document.createElement('span');
                indexLabel.className = 'link-index hidden md:block font-mono text-sm mr-4 select-none';
                indexLabel.textContent = String(index + 1).padStart(2, '0');
                
                // 建立中間的連結標題 (點擊標題會導向)
                const titleLink = document.createElement('a');
                if (link.url && link.url.startsWith('http')) {
                    titleLink.href = link.url;
                    titleLink.target = '_blank';
                    titleLink.rel = 'noopener noreferrer';
                } else {
                    titleLink.href = '#';
                }
                titleLink.className = 'link-title font-semibold transition text-center md:text-left flex-grow text-sm sm:text-base';
                titleLink.textContent = link.title; // textContent 本身就安全，不需再 escape

                // 建立右側的複製按鈕
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn p-1 text-sm transition w-6 flex justify-end items-center';
                copyBtn.title = '複製連結';
                copyBtn.innerHTML = `
                    <svg class="copy-icon" viewBox="0 0 256 256">
                        <path d="M216,32H88a8,8,0,0,0-8,8V82.34a8,8,0,0,0,16,0V48h112V160H173.66a8,8,0,0,0,0,16H216a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,88V216a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V88a8,8,0,0,1,8-8H152A8,8,0,0,1,160,88Zm-16,8H48V200H144Z"/>
                    </svg>
                `;

                // 綁定複製按鈕的點擊事件
                copyBtn.onclick = (e) => {
                    e.preventDefault(); // 防止觸發外層的連結跳轉
                    if (link.url && link.url !== '#') {
                        copyToClipboard(link.url);
                    } else {
                        showToast('此連結未設定網址');
                    }
                };

                // 組裝元素
                container.appendChild(indexLabel);
                container.appendChild(titleLink);
                container.appendChild(copyBtn);
                linksContainer.appendChild(container);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }

        // 為了保持 API 一致性保留此函數
        window.showLinkOptions = function(url) {
            if (url && url !== '#') {
                copyToClipboard(url);
            } else {
                showToast('此連結未設定網址');
            }
        };

        shareBtn.addEventListener('click', () => {
            copyToClipboard(window.location.href);
        });

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('網址已複製到剪貼簿！');
                }).catch(() => {
                    fallbackCopyTextToClipboard(text);
                });
            } else {
                fallbackCopyTextToClipboard(text);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('網址已複製到剪貼簿！');
            } catch (err) {
                showToast('複製失敗');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        window.onload = () => {
            renderApp();
        };
    </script>
</body>
</html>
